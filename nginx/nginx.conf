# ═══════════════════════════════════════════════════════════════════
# Nginx Configuration — ISO 27001 Security Hardened
# A.13.1.1 — Network controls
# A.14.1.2 — Securing application services on public networks
# ═══════════════════════════════════════════════════════════════════

# ── Rate Limiting Zones (ISO 27001 A.9.4.2) ──────────────────────
# Login: 3 requests/min per IP → brute-force prevention
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=3r/m;
# General API: 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Hide Server Identification (ISO 27001 A.14.1.2) ──────────
    server_tokens off;
    # Note: "more_clear_headers Server;" requires ngx_headers_more module
    # We handle this via proxy_hide_header below

    # ── Security Headers (ISO 27001 A.14.1.2) ────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'" always;

    # ── Let's Encrypt ACME Challenge ─────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Block Sensitive Files (ISO 27001 A.12.6.1) ───────────────
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(env|git|gitignore|dockerignore|md|yml|yaml|lock|log|bak|swp|sql)$ {
        deny all;
        return 404;
    }
    location ~* (Dockerfile|docker-compose|Makefile|package\.json|package-lock\.json) {
        deny all;
        return 404;
    }

    # ── Block Swagger/API Docs in Production (ISO 27001 A.9.1.2) ─
    location ~* ^/(api-docs|swagger|swagger-ui|swagger\.json|swagger\.yaml|docs) {
        return 403 '{"error":"Forbidden","message":"API documentation is not available in production."}';
        add_header Content-Type application/json always;
    }

    # ── Frontend SPA ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Re-add security headers for this location
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── Static Assets (long cache for immutable builds) ──────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Login Rate Limiting (ISO 27001 A.9.4.2) ─────────────────
    # Strict: 3 req/min per IP → returns 429 when exceeded
    location = /api/auth/login {
        limit_req zone=login_zone burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://iso50001-backend:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hide upstream server identification
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ── API Proxy to Backend ─────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://iso50001-backend:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 25M;

        # Hide upstream server identification
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Block sensitive file access via API
        location ~* /api/(\.env|\.git) {
            deny all;
            return 404;
        }
    }

    # ── Uploads Proxy — JWT protected, media/document only ───────
    location /uploads/ {
        proxy_pass http://iso50001-backend:5002/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Hide headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Block directory listing
        autoindex off;

        # Only allow safe file extensions
        location ~* \.(jpg|jpeg|png|gif|webp|pdf|doc|docx|xls|xlsx)$ {
            proxy_pass http://iso50001-backend:5002;
        }
        # Block everything else
        location ~* \..+$ {
            deny all;
            return 403;
        }
    }

    # ── Socket.IO Proxy (WebSocket) ──────────────────────────────
    location /socket.io/ {
        proxy_pass http://iso50001-backend:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Hide headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ── Health Check ─────────────────────────────────────────────
    location /health {
        proxy_pass http://iso50001-backend:5002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Hide headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
